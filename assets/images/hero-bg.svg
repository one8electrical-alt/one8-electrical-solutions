<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%">
  <defs>
    <!-- Dark background gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050a14" />
      <stop offset="100%" stop-color="#0e1a30" />
    </linearGradient>
    <!-- Circuit lines gradient -->
    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0066ff" stop-opacity="0.1" />
      <stop offset="50%" stop-color="#00c6ff" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#ffd700" stop-opacity="0.2" />
    </linearGradient>
    <!-- Grid Pattern -->
    <pattern id="grid" width="80" height="80" patternUnits="userSpaceOnUse">
      <path d="M 80 0 L 0 0 0 80" fill="none" stroke="#ffffff" stroke-opacity="0.02" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1920" height="1080" fill="url(#bgGrad)"/>
  <rect width="1920" height="1080" fill="url(#grid)"/>

  <!-- Glowing background blobs -->
  <circle cx="200" cy="200" r="500" fill="#0066ff" fill-opacity="0.12" filter="blur(80px)" />
  <circle cx="1700" cy="800" r="400" fill="#ffd700" fill-opacity="0.05" filter="blur(100px)" />
  <circle cx="960" cy="540" r="300" fill="#00c6ff" fill-opacity="0.08" filter="blur(90px)" />

  <!-- Electrical Circuit Layout Lines -->
  <g stroke="url(#lineGrad)" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="round">
    <!-- Path 1 -->
    <path d="M-100,200 L400,200 L550,350 L900,350 L1000,250 L1400,250 L1550,400 L2000,400" />
    <!-- Path 2 -->
    <path d="M200,1080 L200,800 L350,650 L800,650 L950,800 L1500,800 L1650,950 L2000,950" />
    <!-- Path 3 (Lightning Bolt Overlay in background) -->
    <path d="M1100,-100 L950,450 L1050,450 L850,1180" stroke="#ffd700" stroke-width="4" stroke-opacity="0.15" />
  </g>

  <!-- Circuit nodes / Junctions -->
  <g fill="#00c6ff" opacity="0.8">
    <circle cx="400" cy="200" r="6" />
    <circle cx="550" cy="350" r="6" />
    <circle cx="900" cy="350" r="6" />
    <circle cx="1000" cy="250" r="6" />
    <circle cx="1400" cy="250" r="6" />
    <circle cx="1550" cy="400" r="6" />
    
    <circle cx="200" cy="800" r="6" fill="#ffd700" />
    <circle cx="350" cy="650" r="6" fill="#ffd700" />
    <circle cx="800" cy="650" r="6" fill="#ffd700" />
    <circle cx="950" cy="800" r="6" fill="#ffd700" />
    <circle cx="1500" cy="800" r="6" fill="#ffd700" />
  </g>

  <!-- Title / Branding subtle background watermark -->
  <text x="960" y="580" font-family="'Outfit', sans-serif" font-size="120" font-weight="900" fill="#ffffff" fill-opacity="0.02" text-anchor="middle" letter-spacing="10">ONE8</text>
</svg>
