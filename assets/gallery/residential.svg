<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="resGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0066ff" />
      <stop offset="100%" stop-color="#00c6ff" />
    </linearGradient>
  </defs>
  
  <rect width="800" height="600" fill="url(#resGrad)"/>
  
  <g stroke="#ffffff" stroke-opacity="0.05" stroke-width="1">
    <line x1="100" y1="0" x2="100" y2="600" /><line x1="200" y1="0" x2="200" y2="600" /><line x1="300" y1="0" x2="300" y2="600" /><line x1="400" y1="0" x2="400" y2="600" /><line x1="500" y1="0" x2="500" y2="600" /><line x1="600" y1="0" x2="600" y2="600" /><line x1="700" y1="0" x2="700" y2="600" />
    <line x1="0" y1="100" x2="800" y2="100" /><line x1="0" y1="200" x2="800" y2="200" /><line x1="0" y1="300" x2="800" y2="300" /><line x1="0" y1="400" x2="800" y2="400" /><line x1="0" y1="500" x2="800" y2="500" />
  </g>
  
  <!-- House Blueprint outline -->
  <path d="M250,380 L250,250 L400,130 L550,250 L550,380 Z" fill="none" stroke="url(#accentGrad)" stroke-width="6" stroke-linejoin="round" />
  <!-- Circuit bulbs inside house -->
  <circle cx="400" cy="230" r="30" fill="none" stroke="#ffd700" stroke-width="3" />
  <path d="M390,215 L410,245 M410,215 L390,245" stroke="#ffd700" stroke-width="3" />
  
  <circle cx="310" cy="320" r="15" fill="none" stroke="#00c6ff" stroke-width="2" />
  <circle cx="490" cy="320" r="15" fill="none" stroke="#00c6ff" stroke-width="2" />
  
  <!-- Horizontal wire paths -->
  <path d="M150,380 L650,380 M200,410 L600,410" stroke="#00c6ff" stroke-opacity="0.3" stroke-width="2" stroke-dasharray="10,10" />

  <text x="400" y="520" font-family="'Outfit', sans-serif" font-weight="900" font-size="28" fill="#ffffff" text-anchor="middle">
    RESIDENTIAL WIRING
  </text>
  <text x="400" y="550" font-family="'Inter', sans-serif" font-weight="500" font-size="14" fill="#ffd700" text-anchor="middle" letter-spacing="4">
    safe &amp; smart home setups
  </text>
</svg>
