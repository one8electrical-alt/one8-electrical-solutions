<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="comGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0066ff" />
      <stop offset="100%" stop-color="#00c6ff" />
    </linearGradient>
  </defs>
  
  <rect width="800" height="600" fill="url(#comGrad)"/>
  
  <g stroke="#ffffff" stroke-opacity="0.05" stroke-width="1">
    <line x1="100" y1="0" x2="100" y2="600" /><line x1="200" y1="0" x2="200" y2="600" /><line x1="300" y1="0" x2="300" y2="600" /><line x1="400" y1="0" x2="400" y2="600" /><line x1="500" y1="0" x2="500" y2="600" /><line x1="600" y1="0" x2="600" y2="600" /><line x1="700" y1="0" x2="700" y2="600" />
    <line x1="0" y1="100" x2="800" y2="100" /><line x1="0" y1="200" x2="800" y2="200" /><line x1="0" y1="300" x2="800" y2="300" /><line x1="0" y1="400" x2="800" y2="400" /><line x1="0" y1="500" x2="800" y2="500" />
  </g>
  
  <!-- Commercial building grid schematics -->
  <rect x="250" y="100" width="300" height="360" fill="none" stroke="url(#accentGrad)" stroke-width="5" />
  
  <!-- Floors and Windows -->
  <line x1="250" y1="190" x2="550" y2="190" stroke="url(#accentGrad)" stroke-width="3" />
  <line x1="250" y1="280" x2="550" y2="280" stroke="url(#accentGrad)" stroke-width="3" />
  <line x1="250" y1="370" x2="550" y2="370" stroke="url(#accentGrad)" stroke-width="3" />
  
  <!-- Wire lines glowing inside building -->
  <g stroke="#ffd700" stroke-width="2" opacity="0.8">
    <path d="M 280,420 L 280,120 L 320,120 L 320,380" fill="none" />
    <path d="M 520,420 L 520,150 L 480,150 L 480,380" fill="none" />
    <path d="M 400,450 L 400,100" stroke-dasharray="5,5" fill="none" />
  </g>
  
  <text x="400" y="520" font-family="'Outfit', sans-serif" font-weight="900" font-size="28" fill="#ffffff" text-anchor="middle">
    COMMERCIAL SOLUTIONS
  </text>
  <text x="400" y="550" font-family="'Inter', sans-serif" font-weight="500" font-size="14" fill="#00c6ff" text-anchor="middle" letter-spacing="4">
    office complex &amp; mall services
  </text>
</svg>
